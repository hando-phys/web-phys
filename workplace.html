<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工作區 - 會員中心</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <!-- 頂部導覽列 -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center space-x-2">
                        <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-xl">W</span>
                        <span class="font-bold text-lg text-gray-900 tracking-wider">Workplace</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <img id="user-navbar-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=40&h=40&q=80" alt="Avatar" class="w-9 h-9 rounded-full object-cover border border-gray-200">
                        <span id="user-navbar-name" class="text-sm font-medium text-gray-700 hidden md:inline-block">-</span>
                    </div>
                    <button onclick="handleSignOut()" class="text-sm text-red-600 hover:bg-red-50 px-3 py-2 rounded-lg transition font-medium flex items-center space-x-1">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span class="hidden sm:inline">登出</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主內容區 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 歡迎區塊 -->
        <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl shadow-xl p-8 text-white mb-8">
            <h1 class="text-3xl font-extrabold mb-2">
                歡迎回來，<span id="welcome-name">-</span> 👋
            </h1>
            <p class="text-indigo-100 max-w-xl">
                您已經成功通過安全驗證並進入專屬工作區！這裡為您準備了專案的管理工具以及最近活動狀態。
            </p>
        </div>

        <!-- 內容卡片網格 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- 個人資訊卡片 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center space-x-2">
                        <i class="fa-solid fa-user-shield text-indigo-600"></i>
                        <span>安全帳號資訊</span>
                    </h3>
                    <div class="space-y-3 text-sm">
                        <div>
                            <span class="text-xs font-semibold text-gray-400 block">UID (用戶辨識碼)</span>
                            <span id="info-uid" class="font-mono text-gray-600 break-all">-</span>
                        </div>
                        <div>
                            <span class="text-xs font-semibold text-gray-400 block">信箱地址</span>
                            <span id="info-email" class="text-gray-800 font-medium">-</span>
                        </div>
                        <div>
                            <span class="text-xs font-semibold text-gray-400 block">登入管道</span>
                            <span id="info-provider" class="inline-block mt-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800">
                                -
                            </span>
                        </div>
                    </div>
                </div>
                <div class="mt-6 pt-4 border-t border-gray-100">
                    <span class="text-xs text-green-600 font-semibold flex items-center space-x-1">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>此帳號為安全連線狀態</span>
                    </span>
                </div>
            </div>

            <!-- 工作區統計 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-chart-line text-indigo-600"></i>
                    <span>工作區統計</span>
                </h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-indigo-50 p-4 rounded-lg">
                        <span class="text-xs font-semibold text-indigo-500 block">進行中專案</span>
                        <span class="text-2xl font-bold text-indigo-900">12</span>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-lg">
                        <span class="text-xs font-semibold text-purple-500 block">已完成任務</span>
                        <span class="text-2xl font-bold text-purple-900">148</span>
                    </div>
                </div>
                <div class="mt-6 space-y-2">
                    <div class="flex justify-between text-xs font-medium text-gray-500">
                        <span>專案總進度</span>
                        <span>85%</span>
                    </div>
                    <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                        <div class="bg-indigo-600 h-2 rounded-full" style="width: 85%"></div>
                    </div>
                </div>
            </div>

            <!-- 近期通知 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-bell text-indigo-600"></i>
                    <span>系統通知</span>
                </h3>
                <div class="space-y-4">
                    <div class="flex space-x-3 text-sm">
                        <div class="w-2 h-2 mt-1.5 bg-green-500 rounded-full flex-shrink-0"></div>
                        <div>
                            <p class="font-medium text-gray-800">安全設定更新</p>
                            <p class="text-xs text-gray-400">剛剛</p>
                        </div>
                    </div>
                    <div class="flex space-x-3 text-sm">
                        <div class="w-2 h-2 mt-1.5 bg-indigo-500 rounded-full flex-shrink-0"></div>
                        <div>
                            <p class="font-medium text-gray-800">歡迎加入 Workplace！</p>
                            <p class="text-xs text-gray-400">1 小時前</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 提示框 (Toast Container) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Firebase SDK 引入 (v11 CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signOut, 
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // ==========================================
        // 配置必須與 index.html 相同
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT_ID_HERE.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID_HERE",
            storageBucket: "YOUR_PROJECT_ID_HERE.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID_HERE",
            appId: "YOUR_APP_ID_HERE"
        };

        // 初始化 Firebase
        let app, auth;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
        } catch (error) {
            console.error("Firebase 初始化失敗：", error);
        }

        // ==========================================
        // 監聽 Auth 狀態 (路由守衛保護邏輯)
        // ==========================================
        if (auth) {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // 安全守衛：如果使用者電子信箱尚未驗證 (且不是 Google 帳號授權登入)，立刻踢回 index.html
                    const isGoogleUser = user.providerData.some(p => p.providerId === 'google.com');
                    if (!user.emailVerified && !isGoogleUser) {
                        showToast("您的電子信箱尚未驗證！將於 2 秒後重新導向至登入頁...", "warning");
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 2000);
                        return;
                    }

                    // 已安全驗證，渲染資料到介面
                    const name = user.displayName || user.email.split('@')[0];
                    document.getElementById('welcome-name').innerText = name;
                    document.getElementById('user-navbar-name').innerText = name;
                    document.getElementById('info-uid').innerText = user.uid;
                    document.getElementById('info-email').innerText = user.email || '無電子信箱';
                    
                    // 管道設定
                    const providerSpan = document.getElementById('info-provider');
                    if (isGoogleUser) {
                        providerSpan.innerText = 'Google 快速登入';
                        providerSpan.className = 'inline-block mt-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-800';
                    } else {
                        providerSpan.innerText = '電子信箱密碼登入';
                        providerSpan.className = 'inline-block mt-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-800';
                    }

                    // 大頭貼
                    const avatarUrl = user.photoURL || `https://api.dicebear.com/7.x/adventurer/svg?seed=${user.uid}`;
                    document.getElementById('user-navbar-avatar').src = avatarUrl;
                    
                } else {
                    // 若無任何登入狀態，視為未授權，重新導向回登入頁
                    window.location.href = 'index.html';
                }
            });
        }

        // ==========================================
        // 登出邏輯
        // ==========================================
        window.handleSignOut = async function() {
            try {
                await signOut(auth);
                window.location.href = 'index.html';
            } catch (error) {
                console.error("登出失敗：", error);
                showToast("登出失敗，請重試。", "error");
            }
        };

        // 自訂非阻塞 Toast 提示
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `flex items-center p-4 min-w-[280px] max-w-sm rounded-xl shadow-lg border text-white pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300 ease-out`;
            
            let bgClass = 'bg-blue-600 border-blue-500';
            let icon = 'fa-circle-info';

            if (type === 'success') {
                bgClass = 'bg-green-600 border-green-500';
                icon = 'fa-circle-check';
            } else if (type === 'warning') {
                bgClass = 'bg-yellow-500 border-yellow-400';
                icon = 'fa-triangle-exclamation';
            } else if (type === 'error') {
                bgClass = 'bg-red-600 border-red-500';
                icon = 'fa-circle-xmark';
            }

            toast.className += ` ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} mr-3 text-lg"></i>
                <div class="flex-1 text-sm font-medium mr-2">${message}</div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
        }
    </script>
</body>
</html>
